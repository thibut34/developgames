# Mise en ligne automatique : à chaque nouvelle version envoyée sur GitHub (branche main),
# le jeu est publié sur GitHub Pages (https://thibut34.github.io/developgames/).
# Le zip à envoyer sur CrazyGames est fabriqué en même temps et téléchargeable à :
# https://thibut34.github.io/developgames/developgames-crazygames.zip
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:   # bouton « Run workflow » pour relancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  envoi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparation des fichiers du jeu
        run: |
          mkdir _site
          cp -r index.html style.css js fonts icon.svg manifest.webmanifest sw.js _site/
      - name: Zip pour CrazyGames (SDK activé, sans mode hors ligne)
        run: |
          mkdir _cg
          cp -r index.html style.css js fonts icon.svg _cg/
          sed -i 's/<html lang="fr">/<html lang="fr" data-platform="crazygames">/' _cg/index.html
          sed -i '/rel="manifest"/d' _cg/index.html
          sed -i 's#<link rel="stylesheet" href="fonts/inter.css">#<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script><link rel="stylesheet" href="fonts/inter.css">#' _cg/index.html
          grep -q 'crazygames-sdk-v3.js' _cg/index.html
          grep -q 'data-platform="crazygames"' _cg/index.html
          (cd _cg && zip -qr ../_site/developgames-crazygames.zip .)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
