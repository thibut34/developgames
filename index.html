<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2b20">
  <meta name="description" content="Bâtissez votre cité, du hameau à la Grande Cathédrale.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DevelopGames</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <header id="topbar">
    <div id="resources"></div>
    <div class="pill" id="pop" title="Habitants"><span class="ico">👥</span><span class="val"></span></div>
    <div class="pill" id="happy" title="Bonheur"><span class="ico">🙂</span><span class="val"></span></div>
    <div class="spacer"></div>
    <div class="pill era" id="era-pill" title="Ère actuelle"><span class="ico">🏛️</span><span id="era-name"></span></div>
    <span id="date"></span>
    <div class="speed">
      <button data-speed="0" title="Pause (espace)">⏸</button>
      <button data-speed="1" class="active" title="Vitesse normale">1×</button>
      <button data-speed="2" title="Vitesse ×2">2×</button>
      <button data-speed="4" title="Vitesse ×4">4×</button>
    </div>
  </header>

  <div id="quest" class="card" title="Voir les objectifs"></div>

  <div id="sidebtns">
    <button data-panel="quests" title="Objectifs">🎯</button>
    <button data-panel="era" id="btn-era" title="Ères">⬆️</button>
    <button data-panel="stats" title="Statistiques et impôts">📊</button>
    <button data-panel="trade" title="Commerce">⚖️</button>
    <button data-panel="log" title="Journal">📜</button>
    <button data-panel="options" title="Options">⚙️</button>
  </div>

  <canvas id="minimap" title="Mini-carte : touchez pour vous déplacer"></canvas>

  <aside id="panel" hidden>
    <button class="close" aria-label="Fermer">✕</button>
    <div class="content"></div>
  </aside>

  <div id="toasts"></div>

  <nav id="toolbar">
    <div id="cats"></div>
    <div id="items"></div>
  </nav>

  <div id="modal" hidden><div class="box"></div></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
